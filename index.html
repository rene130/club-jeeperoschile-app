<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Club de Jeeperos de Chile</title>
<meta name="theme-color" content="#1D3C78">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jeeperos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1D3C78; --blue:#2E62B4; --red:#E2452B; --ink:#17202E; --muted:#5E6878;
  --bg:#EEF1F4; --surface:#FFFFFF; --line:#D7DDE5; --soft:#E4E9F0; --on-navy:#FFFFFF;
  --oficial:#2E8B57; --casual:#2AA4D8; --paseo:#E2452B; --otro:#7A8494; --cumple:#B07D00;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#14284F; --blue:#6C9BE6; --red:#F2674E; --ink:#E6EBF2; --muted:#9AA6B8;
    --bg:#0E1524; --surface:#172238; --line:#2A3752; --soft:#1F2B44;
    --oficial:#4CC27F; --casual:#6CCBF2; --paseo:#F2674E; --otro:#8C97A8; --cumple:#E8B93A;
  }
}
:root[data-theme="dark"]{
  --navy:#14284F; --blue:#6C9BE6; --red:#F2674E; --ink:#E6EBF2; --muted:#9AA6B8;
  --bg:#0E1524; --surface:#172238; --line:#2A3752; --soft:#1F2B44;
  --oficial:#4CC27F; --casual:#6CCBF2; --paseo:#F2674E; --otro:#8C97A8; --cumple:#E8B93A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Barlow,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:84px}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif;letter-spacing:.01em;line-height:1.1;margin:0}

/* Header with contour lines */
.top{position:relative;background:var(--navy);color:var(--on-navy);overflow:hidden}
.top svg.topo{position:absolute;inset:0;width:100%;height:100%;opacity:.22;pointer-events:none}
.top svg.jeep-sil{position:absolute;right:max(110px,calc(50% - 400px));bottom:0;height:100%;width:auto;max-width:70%;opacity:.34;pointer-events:none;-webkit-mask-image:linear-gradient(to right,transparent,#000 25%);mask-image:linear-gradient(to right,transparent,#000 25%)}
@media (max-width:600px){.top svg.jeep-sil{max-width:none;right:0;opacity:.22}}
.top-in{position:relative;max-width:980px;margin:0 auto;padding:18px 18px 22px;display:flex;gap:16px;align-items:center}
.logo{width:76px;height:76px;flex:none;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.top h1{font-size:30px;font-weight:700}
.top p{margin:2px 0 0;opacity:.8;font-size:15px}
.me-btn{margin-left:auto;align-self:flex-start;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}

.hbtns{margin-left:auto;align-self:flex-start;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hbtns .me-btn{margin-left:0}
html[data-size="1"] main,html[data-size="1"] .sheet,html[data-size="1"] .toast{zoom:1.15}
html[data-size="2"] main,html[data-size="2"] .sheet,html[data-size="2"] .toast{zoom:1.32}
html[data-size="1"] nav.tabs .in{zoom:1.1}
html[data-size="2"] nav.tabs .in{zoom:1.18}
.sizeopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);margin-bottom:10px}
.sizeopt.on{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--surface))}
.toast .undo{background:none;border:0;color:#F2C230;font-weight:700;margin-left:12px;font-size:inherit;cursor:pointer;padding:4px 2px;text-decoration:underline}
.welcome{position:fixed;inset:0;z-index:70;background:rgba(10,16,28,.6);display:flex;align-items:center;justify-content:center;padding:18px}
.welcome .card{background:var(--bg);color:var(--ink);border-radius:20px;max-width:420px;width:100%;padding:26px 22px 20px;text-align:center}
.welcome .big{font-size:64px;line-height:1;margin-bottom:10px}
.welcome .dots{display:flex;gap:6px;justify-content:center;margin:16px 0}
.welcome .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.welcome .dots i.on{background:var(--red)}
.aviso{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-left:5px solid var(--c,var(--red));border-radius:14px;padding:12px 14px;margin:4px 0 8px;cursor:pointer;color:var(--ink);font:inherit}
.aviso .when{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;color:var(--c,var(--red))}

/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
svg.jeepi{height:auto!important;width:40px}
nav.tabs button svg.jeepi{width:34px!important;height:22px!important}
.trip .ph svg.jeepi{width:64px!important}
nav.tabs button[aria-current="page"]{color:var(--red);font-weight:600}
@media (min-width:860px){
  body{padding-bottom:0}
  nav.tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line)}
  nav.tabs button{flex-direction:row;justify-content:center;gap:8px;font-size:15px;padding:12px 4px}
  nav.tabs button svg{width:18px;height:18px}
}

main{max-width:980px;margin:0 auto;padding:18px 16px 24px}
.h2row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.h2row:first-child{margin-top:4px}
.grid2 .h2row:first-child{margin-top:26px}
h2{font-size:26px;font-weight:700}
h3{font-size:20px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:9px 14px;background:var(--red);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;font-size:15px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.blue{background:var(--blue)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
.link{background:none;border:0;color:var(--blue);font-weight:600;cursor:pointer;padding:0;font-size:15px}

/* Trail-marker date block: the signature element */
.mark{flex:none;width:58px;text-align:center;border-radius:8px;overflow:hidden;background:var(--surface);border:1.5px solid var(--line)}
.mark .m{display:block;background:var(--c,var(--paseo));color:#fff;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;padding:2px 0}
.mark .d{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:28px;line-height:1.15}
.mark .w{display:block;font-size:12px;color:var(--muted);padding-bottom:3px}

.item{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;font-size:17px;line-height:1.25}
.item .s{color:var(--muted);font-size:14px;margin-top:2px}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted);margin-right:6px}
.tag.paseo{background:color-mix(in srgb,var(--paseo) 16%,transparent);color:var(--paseo)}
.tag.oficial{background:color-mix(in srgb,var(--oficial) 16%,transparent);color:var(--oficial)}
.tag.cumple{background:color-mix(in srgb,var(--cumple) 18%,transparent);color:var(--cumple)}
.av{flex:none;width:42px;height:42px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:17px;color:#fff;background:var(--c,var(--blue))}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:96px;height:96px;font-size:36px}
.letter{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;color:var(--muted);margin:14px 0 2px}
.srow{display:flex;align-items:center;gap:12px;width:100%;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.srow:last-child{border-bottom:0}
.srow .sn{font-weight:500;font-size:16.5px;line-height:1.2}
.srow .sn b{font-weight:700}
.srow .ss{font-size:13.5px;color:var(--muted)}
.tag.dir{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.total{display:flex;align-items:baseline;gap:10px;margin:-4px 0 12px}
.total b{font-family:"Barlow Condensed",sans-serif;font-size:44px;line-height:1;color:var(--red)}
.ev-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.chmap{width:62px;display:flex;flex-direction:column;align-items:center;gap:4px}
.chmap svg{width:62px;height:auto;display:block}
.chmap span{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.2}
@media (min-width:600px){.chmap,.chmap svg{width:80px}}
.rsvp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.rsvp-btns{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.rsvp-btns .btn{padding:11px 8px;font-size:15.5px;justify-content:center;text-align:center;line-height:1.2}
.btn.yes{background:var(--oficial)}
.btn.no{background:var(--muted)}
.btn.int{background:#F2C230;color:#17202E}
.rsvp details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.rsvp summary{cursor:pointer;font-weight:600;font-size:15px;padding:4px 0}
.rsvp ul{margin:6px 0 2px;padding-left:20px;columns:2 150px;font-size:15px}
.rsvp li{break-inside:avoid;margin-bottom:2px}
.rsvp .who-me{font-size:13px;color:var(--muted);margin-top:8px}
.more{display:block;margin:8px auto 0;background:none;border:1.5px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14px;color:var(--ink);cursor:pointer}
details.gaia{margin:12px 0}
details.gaia>summary{list-style:none;cursor:pointer;display:inline-flex}
details.gaia>summary::-webkit-details-marker{display:none}
details.gaia .gl{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.gaia .gl a{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
details.gaia .gl a:last-child{border-bottom:0}
details.gaia .gl a:hover{background:var(--soft)}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.chk:last-child{border-bottom:0}
.chk input{width:20px;height:20px;flex:none}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--red)!important;box-shadow:0 0 0 2px color-mix(in srgb,var(--red) 25%,transparent)}
.bl{display:flex;align-items:center;gap:12px;width:100%;padding:9px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit}
.bl:last-child{border-bottom:0}
button.bl{cursor:pointer}
.bl .bd{flex:none;width:58px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:17px;color:var(--cumple)}
.bl .bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl .bw{flex:none;font-size:13.5px;color:var(--muted)}
.bl.today{background:color-mix(in srgb,var(--cumple) 12%,transparent);border-radius:8px;padding-left:8px;padding-right:8px}
.bmonth{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;margin:16px 0 2px;text-transform:capitalize;color:var(--muted)}
.bmonth:first-child{margin-top:4px}
.bday-today{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--cumple) 16%,var(--surface));border:1.5px solid var(--cumple);border-radius:14px;padding:12px 14px;margin:4px 0 8px}
.bday-today .big{font-size:28px}
.tag.casual{background:color-mix(in srgb,var(--casual) 18%,transparent);color:var(--casual)}

.panel{background:var(--surface);border-radius:14px;padding:4px 16px;border:1px solid var(--line)}
.next{background:var(--surface);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.next .cover{aspect-ratio:16/7;background:var(--soft);position:relative}
.next .cover img{width:100%;height:100%;object-fit:cover}
.next .body{padding:14px 16px 16px;display:flex;gap:14px}
.count{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;color:var(--red)}
.grid2{display:grid;gap:16px}
@media (min-width:720px){.grid2{grid-template-columns:1fr 1fr}}

.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.strip button{padding:0;border:0;background:var(--soft);aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:pointer}
.strip img{width:100%;height:100%;object-fit:cover}

/* Calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px}
.cal-h h3{font-size:22px;text-transform:capitalize}
.cal-h button{background:var(--soft);border:0;border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:20px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-g .wd{font-size:12px;color:var(--muted);text-align:center;padding:4px 0}
.cal-g .day{min-height:58px;border:0;background:none;border-radius:8px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.cal-g .day.out{opacity:.35}
.cal-g .day.today .n{background:var(--red);color:#fff;border-radius:999px}
.cal-g .day.sel{background:var(--soft)}
.cal-g .n{font-size:15px;width:28px;height:28px;display:grid;place-items:center}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.dot{width:11px;height:11px;border-radius:50%;background:var(--c)}
.legend .dot{width:12px;height:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 4px 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* Year headers in bitácora */
details.yr{border-bottom:1px solid var(--line)}
details.yr>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 2px}
details.yr>summary::-webkit-details-marker{display:none}
details.yr>summary .yt{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:32px;line-height:1}
details.yr>summary .yc{color:var(--muted);font-size:15px;flex:1}
details.yr>summary .chev{width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;transition:transform .2s;font-size:16px}
details.yr[open]>summary .chev{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){details.yr>summary .chev{transition:none}}
.year{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:44px;color:var(--line);margin:22px 0 4px;line-height:1}
.trip{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.trip .ph{aspect-ratio:4/3;border-radius:10px;background:var(--soft);overflow:hidden;display:grid;place-items:center;color:var(--muted)}
.trip .ph img{width:100%;height:100%;object-fit:cover}

.route{padding:14px 0;border-bottom:1px solid var(--line)}
.route:last-child{border-bottom:0}
.route-top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.diff{font-size:13px;font-weight:600;white-space:nowrap}
.diff i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:2px;background:var(--line)}
.diff i.on{background:var(--red)}

.search{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);margin-bottom:6px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,28,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:88vh}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);z-index:1}
.sheet-h h2{font-size:23px;flex:1}
.x{background:var(--soft);border:0;border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:18px;flex:none}
.sheet-b{padding:14px 16px}
label.f{display:block;margin:0 0 12px;font-size:14px;font-weight:600;color:var(--muted)}
label.f input,label.f textarea,label.f select{display:block;width:100%;margin-top:4px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:400;color:var(--ink)}
label.f textarea{min-height:110px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:10px 0 14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.prose{white-space:pre-wrap;overflow-wrap:anywhere}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:10px}
.gal button{padding:0;border:0;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--soft);cursor:pointer}
.gal img{width:100%;height:100%;object-fit:cover}
.upl{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}

.post{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.post .by{font-size:13.5px;color:var(--muted);margin-bottom:4px}
.who{font-weight:600;color:var(--ink)}

.lb{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
.lb img,.lb video{flex:1;object-fit:contain;min-height:0;width:100%;background:#000}
.vthumb{position:relative;display:block;width:100%;height:100%}
.vthumb::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,rgba(0,0,0,.35) 0 22px,transparent 23px)}
.vthumb .play{position:absolute;left:50%;top:50%;transform:translate(-40%,-50%);z-index:1;color:#fff;font-size:20px;line-height:1}
.vthumb .dur{position:absolute;right:5px;bottom:5px;z-index:1;background:rgba(0,0,0,.65);color:#fff;font-size:11.5px;padding:1px 6px;border-radius:6px}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.meter .bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}
.meter .bar i{display:block;height:100%;background:var(--oficial)}
.meter.warn .bar i{background:var(--red)}
.lb .bar{display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));color:#fff;font-size:14px}
.lb .bar .cap{flex:1}
.lb .tb{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;display:flex;gap:8px}
.lb .tb button,.lb .nav{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:999px;width:40px;height:40px;cursor:pointer;font-size:18px}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%)}
.lb .nav.p{left:10px}.lb .nav.n{right:10px}

.empty{padding:22px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1.5px dashed var(--line);border-radius:14px}
.empty .btn{margin-top:10px}
.note{font-size:14px;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 12px;margin:10px 0}
.live-banner{display:flex;gap:12px;align-items:center;background:var(--red);color:#fff;border-radius:14px;padding:12px 14px;margin:4px 0 8px;width:100%;border:0;text-align:left;cursor:pointer;font:inherit}
.live-banner .lt{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;line-height:1.15}
.live-banner .ls{font-size:14px;opacity:.92;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.live-dot{width:11px;height:11px;border-radius:50%;background:#fff;flex:none;animation:pulse 1.6s infinite}
.live-dot.red{background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.75)}70%{box-shadow:0 0 0 10px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
.tag.live{background:var(--red);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:14px;cursor:pointer}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.composer textarea{width:100%;min-height:70px;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);resize:vertical}
.composer .crow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.prev{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.prev img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.feed{margin:18px 0 0 6px;padding-left:18px;border-left:2px solid var(--line)}
.fp{position:relative;margin-bottom:16px}
.fp::before{content:"";position:absolute;left:-26px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
.fp.status::before{background:var(--blue)}
.fp .meta{font-size:13px;color:var(--muted)}
.fp .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.fp.status .txt{font-weight:600}
.fp img{border-radius:10px;margin-top:6px;max-height:440px;width:100%;object-fit:cover;cursor:pointer}
.fp.pending{opacity:.6}
.ask{position:fixed;inset:0;z-index:99;background:rgba(10,16,28,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.ask-b{background:var(--surface);color:var(--ink);border-radius:16px;padding:18px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.ask-b p{margin:0 0 14px;font-size:17px}
body.kb main{padding-bottom:60vh}
body.kb .sheet-b{padding-bottom:60vh}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;text-align:center;width:max-content;font-size:14px;z-index:80;max-width:90vw}
@media (min-width:860px){.toast{bottom:24px}}
</style>
